packages:
  - '.'
  - 'apps/admin'
# Security fixes for transitive dependencies; keep major lines where patched.
# serialize-javascript, KaTeX and selector-parser require their patched major.
overrides:
  'serialize-javascript@<7.0.5': 7.0.5
  'nanoid@>=4 <5.1.16': 5.1.16
  'fast-uri@>=3 <3.1.8': 3.1.8
  'colord@<2.9.4': 2.9.4
  'sharp@<0.35.5': 0.35.5
  'js-yaml@>=3 <3.15.2': 3.15.2
  # Only js-yaml's library is used. Drop its unused CLI's argparse/sprintf-js.
  # No patched sprintf-js release exists; do not suppress its advisory.
  'js-yaml@3>argparse': '-'
  'svgo@>=2 <2.8.4': 2.8.4
  'svgo@>=4 <4.1.0': 4.1.0
  'undici@>=7 <7.29.1': 7.29.1
  'undici@>=8 <8.10.2': 8.10.2
  'brace-expansion@>=1 <1.1.21': 1.1.21
  'brace-expansion@>=2 <2.1.7': 2.1.7
  'brace-expansion@>=5 <5.0.12': 5.0.12
  'devalue@<5.9.3': 5.9.3
  'http-cache-semantics@<4.2.1': 4.3.0
  'smol-toml@<1.8.1': 1.9.1
  'katex@<0.18.2': 0.18.7
  'source-map-js@>=1 <1.2.2': 1.2.2
  'postcss-selector-parser@<7.1.6': 7.1.6
allowBuilds:
  '@swc/core': true
  cbor-extract: true
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@workflow/astro@5.0.3'
  - '@workflow/builders@5.0.3'
  - '@workflow/cli@5.0.3'
  - '@workflow/core@5.2.0'
  - '@workflow/errors@5.0.3'
  - '@workflow/nest@5.1.1'
  - '@workflow/next@5.0.3'
  - '@workflow/nitro@5.0.3'
  - '@workflow/nuxt@5.0.3'
  - '@workflow/rollup@5.0.3'
  - '@workflow/sveltekit@5.0.3'
  - '@workflow/swc-plugin@5.0.1'
  - '@workflow/vite@5.0.3'
  - '@workflow/web@5.0.3'
  - '@workflow/world-local@5.1.0'
  - '@workflow/world-vercel@5.2.0'
  - '@workflow/world@5.0.3'
  - workflow@5.2.0
