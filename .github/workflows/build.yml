name: Validate blog and management

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: nocticur_admin_test
          POSTGRES_USER: nocticur
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nocticur -d nocticur_admin_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: development
      ADMIN_DEVELOPMENT_DATABASE_URL: postgres://nocticur@localhost:5432/nocticur_admin_test
      ADMIN_TEST_DATABASE_URL: postgres://nocticur@localhost:5432/nocticur_admin_test
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nocticur/admin db:migrate
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm --filter @nocticur/admin type-check
      - run: pnpm --filter @nocticur/admin test
      - run: pnpm --filter @nocticur/admin exec tsx --test ../../scripts/generate-release-manifest.test.ts
      - run: pnpm build
      - run: NITRO_PRESET=vercel pnpm --filter @nocticur/admin build
      - uses: actions/upload-artifact@v4
        with:
          name: validated-static-blog
          path: dist
