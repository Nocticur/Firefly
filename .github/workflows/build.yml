name: Validate blog and management

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm test:site
      - run: pnpm --filter @nocticur/admin type-check
      - run: pnpm --filter @nocticur/admin test
      - run: pnpm --filter @nocticur/admin exec tsx --test ../../scripts/generate-release-manifest.test.ts
      - run: pnpm --filter @nocticur/admin exec tsx --test ../../scripts/crypto-utils.test.ts
      - run: pnpm build:vercel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-static-blog
          path: dist
          retention-days: 1
          compression-level: 9
