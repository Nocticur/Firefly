name: Check friend sites and screenshots

on:
  schedule:
    # Approximately every six days at 13:10 Asia/Shanghai (GitHub cron is UTC).
    - cron: '10 5 1,7,13,19,25 * *'
  workflow_dispatch:
    inputs:
      task:
        description: What to update
        type: choice
        options: [status_only, screenshots_only, both]
        default: status_only
      target_link:
        description: Optional friend name or URL keyword; blank updates all
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: friend-health-${{ github.repository }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      TASK: ${{ inputs.task || 'both' }}
      TARGET_LINK: ${{ inputs.target_link || '' }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          run_install: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx --test scripts/friend-monitor-core.test.ts src/utils/friend-health.test.ts
      - name: Check sites
        if: env.TASK != 'screenshots_only'
        run: pnpm exec tsx scripts/check-friends.ts --task status_only --target "$TARGET_LINK"
      - name: Plan screenshots
        id: plan
        if: env.TASK != 'status_only'
        run: pnpm exec tsx scripts/check-friends.ts --task screenshots_only --target "$TARGET_LINK" --plan
      - name: Install Chromium only when captures are needed
        if: steps.plan.outputs.needs_screenshots == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture site homepages
        if: steps.plan.outputs.needs_screenshots == 'true'
        run: pnpm exec tsx scripts/check-friends.ts --task screenshots_only --target "$TARGET_LINK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: friend-health
          path: |
            public/data/friends-health.json
            public/assets/friends/*.webp
          if-no-files-found: error
          retention-days: 7

  publish-data:
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refuse stale source results
        env:
          SOURCE_SHA: ${{ needs.monitor.outputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo 'Source changed during monitoring. Download the artifact or rerun against the new source.'
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: friend-health
          path: public
      - name: Commit public monitoring output only
        id: commit
        shell: bash
        run: |
          git add -- public/data/friends-health.json
          if [ -d public/assets/friends ]; then
            find public/assets/friends -maxdepth 1 -type f -name '*.webp' -print0 | xargs -0 -r git add --
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update friend health and screenshots'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Validate the generated-data commit explicitly
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
        # GITHUB_TOKEN pushes do not trigger the ordinary push workflow.
        run: gh workflow run build.yml --ref "$TARGET_BRANCH"
